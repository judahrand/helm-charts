suite: serviceaccount
templates:
  - serviceaccount.tpl
tests:
  - it: should create a ServiceAccount by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-multi-networkpolicy-nftables
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should honour a custom name
    set:
      serviceAccount.name: custom
    asserts:
      - equal:
          path: metadata.name
          value: custom

  - it: should add annotations
    set:
      serviceAccount.annotations:
        foo: bar
    asserts:
      - equal:
          path: metadata.annotations.foo
          value: bar

  - it: should not create a ServiceAccount when disabled
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
