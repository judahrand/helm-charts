suite: configmap
templates:
  - configmap.tpl
tests:
  - it: should create the v4 and v6 custom rules ConfigMaps by default
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-multi-networkpolicy-nftables-custom-v4-rules
        documentIndex: 0
      - equal:
          path: data["custom-v4-rules.txt"]
          value: "# Add custom IPv4 rules here if needed\n"
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-multi-networkpolicy-nftables-custom-v6-rules
        documentIndex: 1
      - equal:
          path: data["custom-v6-rules.txt"]
          value: "# Add custom IPv6 rules here if needed\n"
        documentIndex: 1

  - it: should render custom rule contents
    set:
      customRules.ipv4: |
        tcp dport 9999 accept
    asserts:
      - equal:
          path: data["custom-v4-rules.txt"]
          value: "tcp dport 9999 accept\n"
        documentIndex: 0

  - it: should not create any ConfigMap when disabled
    set:
      customRules.enabled: false
    asserts:
      - hasDocuments:
          count: 0
